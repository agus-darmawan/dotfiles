# ROS2 dev layout — every pane opens inside the dev container.
# Launch via the shell helper:   tros <container> [/path/to/ws/in/container]
# Native Linux (no container):   tros "" ~/ros2_ws
session_name: ${SESSION}
start_directory: ~/
shell_command_before:
  - ~/.config/tmux/scripts/denter.sh "${CONTAINER}" "${WS}"
windows:
  - window_name: code
    focus: true
    panes:
      - shell_command:
          - sleep 0.5 && nvim .

  - window_name: build
    layout: main-horizontal
    options:
      main-pane-height: 70%
    panes:
      - shell_command:
          - 'echo "cbp <pkg> · cbu <pkg> · cb · ct <pkg> · rcl"'
        focus: true
      - shell_command:
          - 'echo "lazygit · git log"'

  - window_name: run
    layout: tiled
    panes:
      - shell_command:
          - 'echo "ros2 launch …"'
      - shell_command:
          - 'echo "rtopic · rnode · rif"'
      - blank
      - blank

  - window_name: sys
    panes:
      - shell_command:
          - command -v btop >/dev/null && btop || top
