# Web / Next.js / Flutter dev layout.
# Launch: tweb [dir]   (defaults to current dir)
session_name: ${SESSION}
start_directory: ${WS}
windows:
  - window_name: code
    focus: true
    panes:
      - nvim .

  - window_name: dev
    layout: main-vertical
    options:
      main-pane-width: 60%
    panes:
      - shell_command:
          - 'echo "npm run dev · pnpm dev · flutter run"'
        focus: true
      - blank
      - shell_command:
          - git status -sb

  - window_name: git
    panes:
      - lazygit
