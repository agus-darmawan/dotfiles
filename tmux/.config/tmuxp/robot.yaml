# Field session on a real robot over SSH (ControlMaster makes extra panes instant).
# Launch: trobot <ssh-host>       e.g. trobot go2 · trobot lite3 · trobot genisom
session_name: ${SESSION}
start_directory: ~/
windows:
  - window_name: shell
    focus: true
    panes:
      - ssh ${ROBOT}

  - window_name: monitor
    layout: main-vertical
    options:
      main-pane-width: 60%
    panes:
      - ssh -t ${ROBOT} 'command -v btop >/dev/null && btop || htop || top'
      - ssh ${ROBOT}
      - ssh ${ROBOT}

  - window_name: logs
    layout: even-vertical
    panes:
      - ssh ${ROBOT}
      - ssh -t ${ROBOT} 'journalctl -f -n 50 2>/dev/null || dmesg -w'

  - window_name: local
    panes:
      - blank
