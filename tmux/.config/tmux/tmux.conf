# ─────────────────────────────────────────────────────────────
#  tmux — agus-darmawan/dotfiles
#  prefix = C-a   |   reload = prefix r   |   plugins = prefix I
# ─────────────────────────────────────────────────────────────

# ── Terminal ─────────────────────────────────────────────────
set -g default-terminal "tmux-256color"
set -as terminal-features ",xterm-ghostty:RGB:clipboard:hyperlinks:usstyle:strikethrough"
set -as terminal-features ",xterm-256color:RGB"
set -as terminal-overrides ',*:Smulx=\E[4::%p1%dm'
set -as terminal-overrides ',*:Setulc=\E[58::2::%p1%{65536}%/%d::%p1%{256}%/%{255}%&%d::%p1%{255}%&%d%;m'
set -g extended-keys on
set -as terminal-features "xterm*:extkeys"

# ── Prefix ───────────────────────────────────────────────────
# C-a outside, so a nested tmux on a robot (default C-b) still works.
unbind C-b
set -g prefix C-a
bind C-a send-prefix

# ── General ──────────────────────────────────────────────────
set -g mouse on
set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on
set -g history-limit 100000
set -sg escape-time 0
set -g focus-events on
set -g set-clipboard on
set -gq allow-passthrough on        # tmux 3.3+
set -g detach-on-destroy off
set -g display-time 2000
set -g status-interval 3
setw -g mode-keys vi
setw -g aggressive-resize on
set -g set-titles on
set -g set-titles-string "#S / #W"

# ── Keys ─────────────────────────────────────────────────────
bind r source-file ~/.config/tmux/tmux.conf \; display "󰑓 tmux reloaded"

# splits & windows keep the current path
bind | split-window -h -c "#{pane_current_path}"
bind '\' split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"
bind c new-window -c "#{pane_current_path}"
bind C new-window -c "#{pane_current_path}" -n "$(basename '#{pane_current_path}')"

# resize (repeatable)
bind -r H resize-pane -L 5
bind -r J resize-pane -D 5
bind -r K resize-pane -U 5
bind -r L resize-pane -R 5
bind -r m resize-pane -Z

# window nav
bind -r Tab last-window
bind -r n next-window
bind -r p previous-window
bind -r < swap-window -t -1 \; select-window -t -1
bind -r > swap-window -t +1 \; select-window -t +1

# kill without confirm
bind x kill-pane
bind X kill-window
bind Q confirm-before -p "kill session #S? (y/n)" kill-session

# sync panes (type into all panes at once — e.g. many robots)
bind y setw synchronize-panes \; display "sync #{?synchronize-panes,ON,OFF}"

# clear screen (C-l is taken by pane navigation)
bind C-l send-keys "C-l"

# copy mode
bind v copy-mode
bind -T copy-mode-vi v send -X begin-selection
bind -T copy-mode-vi C-v send -X rectangle-toggle
bind -T copy-mode-vi y send -X copy-selection-and-cancel
bind -T copy-mode-vi Escape send -X cancel

# ── Popups ───────────────────────────────────────────────────
%hidden S="~/.config/tmux/scripts"
bind f display-popup -E -w 70% -h 60% "$S/sessionizer.sh"
bind S display-popup -E -w 70% -h 60% "$S/ssh-picker.sh"
bind s display-popup -E -w 60% -h 50% "$S/session-picker.sh"
bind d display-popup -E -w 70% -h 60% "$S/docker-picker.sh"
bind g display-popup -E -w 90% -h 90% -d "#{pane_current_path}" lazygit
bind D display-popup -E -w 90% -h 90% lazydocker
bind b display-popup -E -w 90% -h 90% btop
bind t display-popup -E -w 85% -h 75% -d "#{pane_current_path}" \
  "tmux new-session -A -s _scratch -c '#{pane_current_path}'"

# ── Nested tmux (SSH into robot running its own tmux) ────────
# F12 turns the outer tmux "off" so every key goes to the inner one.
bind -T root F12 \
  set prefix None \; \
  set key-table off \; \
  set status-style "bg=#45475a,fg=#cdd6f4" \; \
  if -F "#{pane_in_mode}" "send -X cancel" \; \
  refresh-client -S
bind -T off F12 \
  set -u prefix \; \
  set -u key-table \; \
  set -u status-style \; \
  refresh-client -S

# ── Theme: Catppuccin Mocha, status bar on TOP ───────────────
set -g status-position top
set -g status-justify left
set -g status-style "bg=#181825,fg=#cdd6f4"
set -g status-left-length 60
set -g status-right-length 200

set -g pane-border-style "fg=#313244"
set -g pane-active-border-style "fg=#89b4fa"
set -g pane-border-lines heavy
set -g pane-border-status off
set -g message-style "bg=#313244,fg=#cdd6f4"
set -g message-command-style "bg=#313244,fg=#cdd6f4"
set -g mode-style "bg=#45475a,fg=#cdd6f4"
set -gq popup-border-style "fg=#89b4fa"   # tmux 3.3+
set -gq popup-border-lines rounded
setw -g clock-mode-colour "#89b4fa"

# left: session (red when prefix active, gray when nested-off)
set -g status-left "#{?#{==:#{client_key_table},off},#[bg=#6c7086],#{?client_prefix,#[bg=#f38ba8],#[bg=#89b4fa]}}#[fg=#11111b,bold]  #S #[bg=#181825] "

# windows
setw -g window-status-separator ""
setw -g window-status-format "#[fg=#6c7086] #I #W#{?window_zoomed_flag, 󰊓,}#{?window_activity_flag, ●,} "
setw -g window-status-current-format "#[bg=#313244,fg=#cba6f7,bold] #I #[fg=#cdd6f4]#W#{?window_zoomed_flag,#[fg=#f9e2af] 󰊓,}#{?pane_synchronized,#[fg=#f38ba8] 󰓦,} #[bg=#181825]"
setw -g monitor-activity on
set -g visual-activity off

# right: ros · cpu · mem · docker · ip · battery · host · time
set -g status-right "\
#{?#{==:#{client_key_table},off},#[fg=#f38ba8]#[bold] OFF(F12) #[nobold],}\
#{?@ros_domain,#[fg=#94e2d5]󰚩 #{@ros_distro}:#{@ros_domain} ,}\
#[fg=#f9e2af] #($S/status.sh cpu) \
#[fg=#a6e3a1]󰍛 #($S/status.sh mem) \
#[fg=#89dceb]#($S/status.sh docker)\
#[fg=#b4befe]#($S/status.sh net)\
#[fg=#fab387]#($S/status.sh battery)\
#[fg=#6c7086]#h \
#[bg=#89b4fa,fg=#11111b,bold] 󰥔 %H:%M "

# ── Plugins (TPM, stored outside the repo) ───────────────────
set-environment -g TMUX_PLUGIN_MANAGER_PATH "~/.local/share/tmux/plugins/"
set -g @plugin "tmux-plugins/tpm"
set -g @plugin "tmux-plugins/tmux-yank"
set -g @plugin "tmux-plugins/tmux-resurrect"
set -g @plugin "tmux-plugins/tmux-continuum"
set -g @plugin "christoomey/vim-tmux-navigator"

set -g @resurrect-capture-pane-contents "on"
set -g @resurrect-processes "ssh btop lazygit lazydocker '~nvim'"
set -g @continuum-restore "on"
set -g @continuum-save-interval "10"

# local overrides (not in git)
source-file -q ~/.config/tmux/tmux.local.conf

run -b "~/.local/share/tmux/plugins/tpm/tpm"
