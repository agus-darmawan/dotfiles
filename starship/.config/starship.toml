"$schema" = 'https://starship.rs/config-schema.json'

# user@host:path  git  [ros]  [node/python]  duration
# ❯
# The host is always shown, so you know if you are on the Mac, in a container or on a robot.
format = """
$container$username$hostname$directory$git_branch$git_state$git_status\
${env_var.ROS_DISTRO}${env_var.ROS_DOMAIN_ID}${env_var.ROS_MASTER}\
$python$nodejs$cmd_duration
$character"""

palette = "catppuccin_mocha"
add_newline = true
command_timeout = 800

[container]
symbol = " "
style = "fg:sky"
format = "[$symbol]($style)"

[username]
show_always = true
style_user = "bold fg:green"
style_root = "bold fg:red"
format = "[$user@]($style)"

[hostname]
ssh_only = false
style = "bold fg:green"
format = "[$hostname]($style)[:](fg:overlay1)"

[directory]
style = "bold fg:blue"
read_only = " 󰌾"
truncation_length = 12
truncate_to_repo = false
truncation_symbol = "…/"
format = "[$path]($style)[$read_only]($read_only_style) "

[git_branch]
symbol = " "
style = "fg:mauve"
format = "[$symbol$branch]($style) "

[git_status]
style = "fg:red"
format = "([$all_status$ahead_behind]($style) )"
ahead = "⇡$count"
behind = "⇣$count"
diverged = "⇕⇡$ahead_count⇣$behind_count"
modified = "!$count"
staged = "+$count"
untracked = "?$count"
stashed = "≡"

# ROS: only appears where ROS is sourced (containers, robots)
[env_var.ROS_DISTRO]
symbol = "󰚩 "
style = "fg:teal"
format = "[$symbol$env_value ]($style)"

[env_var.ROS_DOMAIN_ID]
style = "fg:teal"
format = "[#$env_value ]($style)"

[env_var.ROS_MASTER]
style = "fg:teal"
format = "[@$env_value ]($style)"

[python]
symbol = " "
style = "fg:yellow"
format = "[$symbol$pyenv_prefix($version )(\\($virtualenv\\) )]($style)"
detect_extensions = []
detect_files = ["pyproject.toml", "requirements.txt", ".python-version"]

[nodejs]
symbol = " "
style = "fg:green"
format = "[$symbol($version )]($style)"

[cmd_duration]
min_time = 2000
style = "fg:overlay1"
format = "[󱎫 $duration]($style)"

[character]
success_symbol = "[❯](bold fg:green)"
error_symbol = "[❯](bold fg:red)"
vimcmd_symbol = "[❮](bold fg:green)"

[palettes.catppuccin_mocha]
rosewater = "#f5e0dc"
flamingo = "#f2cdcd"
pink = "#f5c2e7"
mauve = "#cba6f7"
red = "#f38ba8"
maroon = "#eba0ac"
peach = "#fab387"
yellow = "#f9e2af"
green = "#a6e3a1"
teal = "#94e2d5"
sky = "#89dceb"
sapphire = "#74c7ec"
blue = "#89b4fa"
lavender = "#b4befe"
text = "#cdd6f4"
subtext1 = "#bac2de"
subtext0 = "#a6adc8"
overlay2 = "#9399b2"
overlay1 = "#7f849c"
