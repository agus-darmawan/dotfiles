"$schema" = 'https://starship.rs/config-schema.json'

# Two-line prompt: context on top, clean input line below.
format = """
$os$container$username$hostname$directory$git_branch$git_state$git_status\
${env_var.ROS_DISTRO}${env_var.ROS_DOMAIN_ID}\
$python$nodejs$dart$rust$golang$swift$docker_context$cmd_duration
$character"""

palette = "catppuccin_mocha"
add_newline = true
command_timeout = 800

[os]
disabled = false
style = "fg:lavender"
format = "[$symbol ]($style)"

[os.symbols]
Macos = ""
Ubuntu = ""
Debian = ""
Linux = ""

[container]
symbol = " "
style = "bold fg:sky"
format = "[$symbol$name]($style) "

[username]
show_always = false
style_user = "fg:peach"
style_root = "bold fg:red"
format = "[$user]($style)"

[hostname]
ssh_only = true
ssh_symbol = "󰣀 "
style = "fg:peach"
format = "[@$hostname$ssh_symbol]($style) "

[directory]
style = "bold fg:blue"
read_only = " 󰌾"
truncation_length = 4
truncate_to_repo = false
fish_style_pwd_dir_length = 1
format = "[$path]($style)[$read_only]($read_only_style) "

[directory.substitutions]
"~/Projects" = "󰲋 "
"~/dotfiles" = " "

[git_branch]
symbol = " "
style = "fg:mauve"
format = "[$symbol$branch]($style) "

[git_status]
style = "fg:red"
format = "([$all_status$ahead_behind]($style) )"
ahead = "⇡$count"
behind = "⇣$count"
diverged = "⇕⇡$ahead_count⇣$behind_count"
modified = "!$count"
staged = "+$count"
untracked = "?$count"
stashed = "≡"

[env_var.ROS_DISTRO]
symbol = "󰚩 "
style = "fg:teal"
format = "[$symbol$env_value]($style)"

[env_var.ROS_DOMAIN_ID]
style = "fg:teal"
format = "[#$env_value]($style) "

[python]
symbol = " "
style = "fg:yellow"
format = "[$symbol$pyenv_prefix($version )(\\($virtualenv\\) )]($style)"
detect_extensions = []
detect_files = ["pyproject.toml", "requirements.txt", "setup.py", ".python-version"]

[nodejs]
symbol = " "
style = "fg:green"
format = "[$symbol($version )]($style)"

[dart]
symbol = " "
style = "fg:blue"
format = "[$symbol($version )]($style)"

[rust]
symbol = " "
style = "fg:peach"
format = "[$symbol($version )]($style)"

[golang]
symbol = " "
style = "fg:sky"
format = "[$symbol($version )]($style)"

[swift]
symbol = " "
style = "fg:peach"
format = "[$symbol($version )]($style)"

[docker_context]
symbol = " "
style = "fg:sky"
format = "[$symbol$context]($style) "

[cmd_duration]
min_time = 2000
style = "fg:overlay1"
format = "[󱎫 $duration]($style)"

[character]
success_symbol = "[❯](bold fg:green)"
error_symbol = "[❯](bold fg:red)"
vimcmd_symbol = "[❮](bold fg:green)"

[palettes.catppuccin_mocha]
rosewater = "#f5e0dc"
flamingo = "#f2cdcd"
pink = "#f5c2e7"
mauve = "#cba6f7"
red = "#f38ba8"
maroon = "#eba0ac"
peach = "#fab387"
yellow = "#f9e2af"
green = "#a6e3a1"
teal = "#94e2d5"
sky = "#89dceb"
sapphire = "#74c7ec"
blue = "#89b4fa"
lavender = "#b4befe"
text = "#cdd6f4"
subtext1 = "#bac2de"
subtext0 = "#a6adc8"
overlay2 = "#9399b2"
overlay1 = "#7f849c"
overlay0 = "#6c7086"
surface2 = "#585b70"
surface1 = "#45475a"
surface0 = "#313244"
base = "#1e1e2e"
mantle = "#181825"
crust = "#11111b"
