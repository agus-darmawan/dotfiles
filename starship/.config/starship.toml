"$schema" = 'https://starship.rs/config-schema.json'

# Minimal, ASCII only: the current folder, git, ROS (where sourced), slow-command time.
#   dotfiles main* > _
# The host is not in the prompt: the tab title and the tmux window name show it.
format = """
$directory$git_branch$git_status${env_var.ROS_DISTRO}${env_var.ROS_DOMAIN_ID}${env_var.ROS_MASTER}$cmd_duration\
$character"""

add_newline = false
command_timeout = 800

[directory]
truncation_length = 1
truncate_to_repo = false
truncation_symbol = ""
home_symbol = "~"
read_only = " [ro]"
style = "bold blue"
format = "[$path]($style)[$read_only]($read_only_style) "

[git_branch]
symbol = ""
style = "purple"
format = "[$branch]($style)"

[git_status]
style = "red"
format = "([$conflicted$modified$staged$untracked$ahead_behind]($style)) "
conflicted = "!"
modified = "*"
staged = "+"
untracked = "?"
ahead = "^"
behind = "v"
diverged = "^v"
stashed = ""
deleted = ""
renamed = ""
typechanged = ""

# ROS: only appears where ROS is sourced (containers, robots)
[env_var.ROS_DISTRO]
style = "cyan"
format = "[$env_value ]($style)"

[env_var.ROS_DOMAIN_ID]
style = "cyan"
format = "[#$env_value ]($style)"

[env_var.ROS_MASTER]
style = "cyan"
format = "[@$env_value ]($style)"

[cmd_duration]
min_time = 2000
style = "yellow"
format = "[$duration]($style) "

[character]
success_symbol = "[>](bold green)"
error_symbol = "[>](bold red)"
vimcmd_symbol = "[<](bold green)"
vimcmd_visual_symbol = "[<](bold yellow)"
